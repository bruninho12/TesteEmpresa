<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#78f794;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4dd0e1;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="moleculeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#78f794;stop-opacity:0.4" />
    </radialGradient>
  </defs>
  
  <!-- Brain shape -->
  <path d="M15 20 C10 15, 10 10, 18 8 C20 6, 25 6, 28 8 C35 6, 40 10, 38 15 C42 18, 42 25, 38 28 C40 32, 35 38, 28 36 C25 38, 20 38, 18 36 C10 38, 5 32, 8 28 C4 25, 4 18, 8 15 Z" 
        fill="url(#brainGradient)" 
        stroke="#ffffff" 
        stroke-width="0.5" 
        opacity="0.9"/>
        
  <!-- Brain neural pathways -->
  <path d="M12 18 Q20 20, 25 15 Q30 20, 38 18" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="0.8" 
        opacity="0.6"/>
  <path d="M10 25 Q18 22, 25 28 Q32 25, 40 25" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="0.8" 
        opacity="0.6"/>
        
  <!-- Molecule atoms -->
  <circle cx="18" cy="15" r="2.5" fill="url(#moleculeGradient)" stroke="#4dd0e1" stroke-width="0.5"/>
  <circle cx="25" cy="12" r="2" fill="url(#moleculeGradient)" stroke="#4dd0e1" stroke-width="0.5"/>
  <circle cx="32" cy="16" r="2.5" fill="url(#moleculeGradient)" stroke="#4dd0e1" stroke-width="0.5"/>
  <circle cx="22" cy="22" r="1.8" fill="url(#moleculeGradient)" stroke="#4dd0e1" stroke-width="0.5"/>
  <circle cx="28" cy="26" r="2.2" fill="url(#moleculeGradient)" stroke="#4dd0e1" stroke-width="0.5"/>
  
  <!-- Molecule bonds -->
  <line x1="18" y1="15" x2="25" y2="12" stroke="#78f794" stroke-width="1" opacity="0.7"/>
  <line x1="25" y1="12" x2="32" y2="16" stroke="#78f794" stroke-width="1" opacity="0.7"/>
  <line x1="18" y1="15" x2="22" y2="22" stroke="#78f794" stroke-width="1" opacity="0.7"/>
  <line x1="22" y1="22" x2="28" y2="26" stroke="#78f794" stroke-width="1" opacity="0.7"/>
  <line x1="32" y1="16" x2="28" y2="26" stroke="#78f794" stroke-width="1" opacity="0.7"/>
  
  <!-- Glow effect -->
  <circle cx="25" cy="22" r="20" fill="none" stroke="url(#brainGradient)" stroke-width="0.5" opacity="0.3"/>
</svg>